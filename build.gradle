plugins {
	id 'org.springframework.boot' version '3.2.0' apply false
	id 'io.spring.dependency-management' version '1.1.0' apply false
}

allprojects {
	group = 'com.ec.app'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
		mavenLocal()
	}
}

subprojects {
	apply plugin: 'java-library'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'maven-publish'

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
	}

	compileJava {
		options.compilerArgs << '-parameters'
	}

	// Versiones gestionadas: las dependencias de los módulos se declaran sin versión
	dependencyManagement {
		dependencies {
			// Spring Framework
			dependencySet(group: 'org.springframework.boot', version: '3.2.0') {
				entry 'spring-boot-starter-web'
				entry 'spring-boot-autoconfigure'
				entry 'spring-boot-starter-data-jpa'
				entry 'spring-boot-starter-test'
			}

			// Persistence
			dependency 'jakarta.persistence:jakarta.persistence-api:3.1.0'
			dependency 'jakarta.annotation:jakarta.annotation-api:2.1.1'
			dependencySet(group: 'org.springframework.data', version: '3.2.0') {
				entry 'spring-data-commons'
				entry 'spring-data-jpa'
			}
			dependency 'org.postgresql:postgresql:42.7.4'

			// Lombok
			dependency 'org.projectlombok:lombok:1.18.32'

			// Jakarta
			dependency 'jakarta.validation:jakarta.validation-api:3.0.2'
			dependency 'jakarta.servlet:jakarta.servlet-api:6.0.0'

			// Spring WS
			dependency 'org.springframework.ws:spring-ws-core:3.1.6'

			// MapStruct
			dependency 'org.mapstruct:mapstruct:1.6.0.Beta1'
			dependency 'org.mapstruct:mapstruct-processor:1.6.0.Beta1'

			// Jasper
			dependency 'net.sf.jasperreports:jasperreports:6.17.0'
			dependency 'com.lowagie:itext:2.1.7'
			dependency 'org.apache.commons:commons-collections4:4.4'
		}
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java
				versionMapping {
					usage('java-api') {
						fromResolutionOf('runtimeClasspath')
					}
					usage('java-runtime') {
						fromResolutionResult()
					}
				}
			}
		}
		repositories {
			mavenLocal()
		}
	}
}
