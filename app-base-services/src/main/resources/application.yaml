# Configuración común a todos los entornos.
# El perfil NO se fija aquí: se activa con la variable SPRING_PROFILES_ACTIVE (ej. dev).
spring:
  application:
    name: gimnasio-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # nunca update/create: las tablas las crea Flyway
      # Sin estrategia de nombres propia: Spring Boot convierte
      # fechaInicio -> fecha_inicio, que es como están las tablas.

logging:
  level:
    org.springframework.web: INFO